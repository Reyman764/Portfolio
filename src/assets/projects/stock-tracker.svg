<svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="gridStock" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="480" height="270" fill="#0c0c0f"/>
  <rect width="480" height="270" fill="url(#gridStock)"/>

  <!-- baseline -->
  <line x1="55" y1="205" x2="405" y2="205" stroke="#27272a" stroke-width="1.5"/>

  <!-- bar chart, ascending (accent, slight tint fill, sharp corners to match site radius:0) -->
  <g stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round">
    <rect x="105" y="170" width="28" height="35" fill="#6366f1" fill-opacity="0.14"/>
    <rect x="148" y="145" width="28" height="60" fill="#6366f1" fill-opacity="0.14"/>
    <rect x="191" y="120" width="28" height="85" fill="#6366f1" fill-opacity="0.14"/>
    <rect x="234" y="90" width="28" height="115" fill="#6366f1" fill-opacity="0.14"/>
  </g>

  <!-- trend line + endpoint marker (amber accent) -->
  <polyline points="119,170 162,145 205,120 248,90 272,70" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="272" cy="70" r="5" fill="#fbbf24"/>

  <!-- phone silhouette -->
  <g stroke="#a1a1aa" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="298" y="58" width="92" height="164" rx="10"/>
    <line x1="330" y1="212" x2="358" y2="212" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- phone screen content: mini list rows -->
  <g stroke="#3f3f46" stroke-width="2" stroke-linecap="round">
    <line x1="312" y1="84" x2="376" y2="84"/>
    <line x1="312" y1="100" x2="376" y2="100"/>
    <line x1="312" y1="116" x2="360" y2="116"/>
  </g>
  <!-- small notification dot on phone -->
  <circle cx="380" cy="70" r="5" fill="#fbbf24"/>

  <!-- corner tag -->
  <rect x="18" y="222" width="168" height="28" fill="#09090b" fill-opacity="0.75" stroke="#27272a"/>
  <text x="28" y="240" font-family="monospace" font-size="12" fill="#a1a1aa" letter-spacing="0.5">[ inventory_tracker ]</text>
</svg>
