<svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="gridJWR" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="480" height="270" fill="#0c0c0f"/>
  <rect width="480" height="270" fill="url(#gridJWR)"/>

  <!-- sun -->
  <circle cx="405" cy="58" r="15" fill="#78350f" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- distant mountains -->
  <polyline points="0,118 55,92 105,112 165,80 225,108 290,86 350,110 410,92 480,116"
    fill="none" stroke="#52525b" stroke-width="2" opacity="0.55" stroke-linejoin="round"/>

  <!-- ground line -->
  <line x1="0" y1="196" x2="480" y2="196" stroke="#27272a" stroke-width="1.5"/>

  <!-- background trees, far left + far right (muted, small, no overlap with anything else) -->
  <g stroke="#52525b" stroke-width="2" fill="none" opacity="0.7" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="45,185 65,145 85,185"/>
    <rect x="61" y="185" width="8" height="11"/>
    <polygon points="395,185 415,145 435,185"/>
    <rect x="411" y="185" width="8" height="11"/>
  </g>

  <!-- lodge (focal, accent color line art) -->
  <g stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="185,150 240,98 295,150"/>
    <rect x="200" y="150" width="80" height="46"/>
    <rect x="231" y="164" width="18" height="32"/>
    <rect x="212" y="160" width="14" height="14"/>
    <rect x="254" y="160" width="14" height="14"/>
    <line x1="240" y1="98" x2="240" y2="88"/>
    <line x1="234" y1="88" x2="246" y2="88"/>
  </g>

  <!-- foreground trees flanking lodge (accent, taller, closer) -->
  <g stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="129,178 155,120 181,178"/>
    <rect x="151" y="178" width="8" height="18"/>
    <polygon points="299,178 325,120 351,178"/>
    <rect x="321" y="178" width="8" height="18"/>
  </g>

  <!-- corner tag -->
  <rect x="18" y="222" width="176" height="28" fill="#09090b" fill-opacity="0.75" stroke="#27272a"/>
  <text x="28" y="240" font-family="monospace" font-size="12" fill="#a1a1aa" letter-spacing="0.5">[ resort_booking_app ]</text>
</svg>
